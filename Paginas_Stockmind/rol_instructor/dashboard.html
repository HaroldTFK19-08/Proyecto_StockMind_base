<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="icon" type="image/svg+xml" href="/IMG/imgs-admin/Capa2.svg">
    <link rel="stylesheet" href="/estilos_paginas/estilos_instructor/dash.css">
    <link rel="stylesheet" href="/estilos_paginas/estilos_instructor/todo.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <aside>
        <div class="izquierda">
            <div class="logo">
                <img src="/IMG/imgs/Capa 1.svg" alt="stockmind">
            </div>
        </div>
        <div class="navegacion">
            <nav>
                <ul>
                    <li class="selected"><a href="/Paginas_Stockmind/rol_instructor/dashboard.html"><i class="bi bi-house-door"></i>Dashboard</a></li>
                    <li><a href="/Paginas_Stockmind/rol_instructor/ambientes.html"><i class="bi bi-building"></i>Ambientes</a></li>
                    <li><a href="/Paginas_Stockmind/rol_instructor/historial-reportes.html"><i class="bi bi-clock-history"></i>Historial de reportes</a></li>
                </ul>
            </nav>
        </div>
    </aside>
    <main>
        <header>
            <div class="barra-buscador">
                <input type="text" placeholder="Buscar..."minlength="1">
                <i class="bi bi-search"></i>
            </div>
            <div class="derecha">
                <div class="iconos">
                    <i class="bi bi-bell"></i>
                </div>
                <div class="perfil">
                    <div class="info">
                        <span>santiago chilito</span>
                        <small>Instructor</small>
                    </div>
                    <a href="/Paginas_Stockmind/rol_instructor/perfil.html"><div class="avatar"></div></a>
                </div>
            </div>
        </header>
        <section>
            <div class="parte-inicial">
                <h1>Dashboard</h1>
                <p>Bienvenido al dashboard del instructor.</p>
            </div>
            <div class="barra">
            <div class="tarjetas">
                <div class="tarjeta azul">
                    <h4>Ambientes</h4>
                    <span>30</span>
                </div>
            </div>
            <div class="tarjetas">
                <div class="tarjeta rosa">
                    <h4>Reportes</h4>
                    <span>66</span>
                </div>
            </div>
            </div>
        </section>
        <br>
        <section>
                <div class="parte-inferior">
                    <h2>Gráficos y estadísticas</h2>
                    <p>Aquí puedes agregar gráficos y estadísticas relevantes para el instructor.</p>
                    <canvas id="myChart"></canvas>
                </div>
                
        </section>
    </main>
    <script src="/JS/instructor/dash.js"></script>
</body>
</html>
